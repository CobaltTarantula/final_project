{% extends "base.html" %}
{% block title %}Edit dictionary entry · Faeric{% endblock %}
{% block content %}
  <h1>Edit dictionary entry</h1>
  <p class="subtitle">Update the English and Faeric forms or their pronunciation details.</p>
  {% if message %}<p class="notice" role="status">{{ message }}</p>{% endif %}
  <form method="post" class="entry-form">
    <input type="hidden" name="page" value="{{ page }}">
    <input type="hidden" name="q" value="{{ search }}">
    <label>English word or phrase<input name="english" maxlength="120" value="{{ entry.english }}" required></label>
    <label>Faeric word or phrase<input class="faeric-text" name="faeric" maxlength="120" value="{{ entry.faeric }}" required></label>
    <label>Pronunciation <span class="optional">(optional)</span><input name="pronunciation" maxlength="120" value="{{ entry.pronunciation }}" placeholder="Pronunciation guide"></label>
    <label>Part of speech <span class="optional">(optional)</span><input name="part_of_speech" maxlength="120" value="{{ entry.part_of_speech }}" placeholder="noun, verb, adjective"></label>
    <label>Notes <span class="optional">(optional)</span><input name="notes" maxlength="120" value="{{ entry.notes }}" placeholder="Pronunciation or usage note"></label>
    <div class="edit-actions">
      <button class="primary-button" type="submit">Save changes</button>
      <a href="{{ url_for('dictionary', page=page, q=search) }}">Cancel</a>
    </div>
  </form>
{% endblock %}
